# ============================================================
# TALEND CI/CD - GITHUB ACTIONS
# ============================================================

on:
  workflow_dispatch:

  push:
    branches:
      - main


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:

  # ----------------------------------------------------------
  # Talend project
  # ----------------------------------------------------------
  PROJECT_NAME: "TALEND_CICD"
  CI_REPO_NAME: "talend_cicd"

  # ----------------------------------------------------------
  # Git
  # ----------------------------------------------------------
  GIT_MAIN_PROJECT_BRANCH: "main"
  GIT_MAIN_PROJECT_PATH: "main"

  # ----------------------------------------------------------
  # Talend artifact
  # ----------------------------------------------------------
  JOB_LIST: "jobs/process/mydemo_0.1"

  # ----------------------------------------------------------
  # Maven
  # ----------------------------------------------------------
  MAVEN_SETTINGS: "maven_settings.xml"

  # ----------------------------------------------------------
  # Talend Cloud
  # ----------------------------------------------------------
  TALEND_CLOUD_ENV: "Dev"
  TALEND_CLOUD_WORKSPACE: "Cloud_Run"

  # ----------------------------------------------------------
  # Maven profile
  # ----------------------------------------------------------
  MAVEN_PLUGIN: "-Pcloud-publisher"


# ============================================================
# JOB
# ============================================================

jobs:

  display-variables:

    name: Talend Build & Deploy

    environment: Dev

    runs-on: self-hosted

    steps:

      # ======================================================
      # 1. CONFIGURE JAVA, MAVEN AND GPG
      # ======================================================

      - name: Configure Java, Maven and GPG
        shell: powershell

        run: |

          Write-Host "=============================================="
          Write-Host "Configuring Java, Maven and GPG"
          Write-Host "=============================================="

          $javaHome = "C:\Program Files\Java\jdk-17"
          $mavenHome = "C:\apache-maven-3.9.16-bin\apache-maven-3.9.16"
          $mavenBin = Join-Path $mavenHome "bin"

          if (!(Test-Path "$javaHome\bin\java.exe")) {
            Write-Error "Java not found: $javaHome"
            exit 1
          }

          if (!(Test-Path "$mavenBin\mvn.cmd")) {
            Write-Error "Maven not found: $mavenBin"
            exit 1
          }

          "JAVA_HOME=$javaHome" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          "MAVEN_HOME=$mavenHome" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          "$javaHome\bin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Append `
            -Encoding utf8

          "$mavenBin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Append `
            -Encoding utf8

          Write-Host ""
          Write-Host "Java version:"
          & "$javaHome\bin\java.exe" -version

          Write-Host ""
          Write-Host "Maven version:"
          & "$mavenBin\mvn.cmd" -version

          Write-Host ""
          Write-Host "GPG version:"
          gpg --version


      # ======================================================
      # 2. CHECKOUT TALEND PROJECT
      # ======================================================

      - name: Git Checkout
        uses: actions/checkout@v4

        with:
          path: ${{ env.GIT_MAIN_PROJECT_PATH }}
          ref: ${{ env.GIT_MAIN_PROJECT_BRANCH }}
          clean: true


      # ======================================================
      # 3. CHECK TALEND CI VARIABLES
      # ======================================================

      - name: Check Talend CI variables
        shell: powershell

        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}

        run: |

          Write-Host "=============================================="
          Write-Host "Talend CI Variables"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "P2_UPDATE_URL = '${{ vars.P2_UPDATE_URL }}'"
          Write-Host "TALEND_CLOUD_URL = '${{ vars.TALEND_CLOUD_URL }}'"
          Write-Host "TALEND_CLOUD_ENV = '${{ env.TALEND_CLOUD_ENV }}'"
          Write-Host "TALEND_CLOUD_WORKSPACE = '${{ env.TALEND_CLOUD_WORKSPACE }}'"
          Write-Host "BUILDER_MAVEN_PLUGIN_VERSION = '${{ vars.BUILDER_MAVEN_PLUGIN_VERSION }}'"

          if ([string]::IsNullOrWhiteSpace("${{ vars.P2_UPDATE_URL }}")) {
            Write-Error "P2_UPDATE_URL is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace("${{ vars.TALEND_CLOUD_URL }}")) {
            Write-Error "TALEND_CLOUD_URL is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace("${{ env.TALEND_CLOUD_ENV }}")) {
            Write-Error "TALEND_CLOUD_ENV is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace("${{ env.TALEND_CLOUD_WORKSPACE }}")) {
            Write-Error "TALEND_CLOUD_WORKSPACE is empty."
            exit 1
          }

          Write-Host ""
          Write-Host "Talend CI variables are valid."


      # ======================================================
      # 4. SET MAVEN OPTIONS
      # ======================================================

      - name: Set MAVEN_OPTS for Talend Cloud
        shell: powershell

        run: |

          Write-Host "=============================================="
          Write-Host "Setting MAVEN_OPTS"
          Write-Host "=============================================="

          # --------------------------------------------------
          # IMPORTANT
          #
          # Do NOT put Cloud Publisher parameters in MAVEN_OPTS.
          #
          # They are passed directly to the final Maven build
          # command in step 11.
          #
          # Do NOT use:
          #   -Dproduct.path
          #   -Dp2Installer.path
          #   -Dtalend.studio.p2.base
          #
          # CI Builder can manage the CommandLine installation
          # automatically.
          # --------------------------------------------------

          $mavenOpts = @(
            "-Dlicense.path=${{ env.CI_REPO_NAME }}/license"
            "-Dtalend.studio.p2.update=${{ vars.P2_UPDATE_URL }}"
            "-Dgeneration.type=local"
            "-Dorg.slf4j.simpleLogger.showDateTime=true"
            "-Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS"
          )

          $mavenOptsString = $mavenOpts -join " "

          "MAVEN_OPTS=$mavenOptsString" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "MAVEN_OPTS configured successfully."


      # ======================================================
      # 5. DISPLAY CONFIGURATION
      # ======================================================

      - name: Display configuration
        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "GITHUB / TALEND CI-CD CONFIGURATION"
          Write-Host "======================================================"

          Write-Host "PROJECT_NAME: ${{ env.PROJECT_NAME }}"
          Write-Host "CI_REPO_NAME: ${{ env.CI_REPO_NAME }}"
          Write-Host "GIT_MAIN_PROJECT_BRANCH: ${{ env.GIT_MAIN_PROJECT_BRANCH }}"
          Write-Host "GIT_MAIN_PROJECT_PATH: ${{ env.GIT_MAIN_PROJECT_PATH }}"
          Write-Host "JOB_LIST: ${{ env.JOB_LIST }}"
          Write-Host "MAVEN_SETTINGS: ${{ env.MAVEN_SETTINGS }}"

          Write-Host ""
          Write-Host "TALEND CLOUD"

          Write-Host "TALEND_CLOUD_URL: ${{ vars.TALEND_CLOUD_URL }}"
          Write-Host "TALEND_CLOUD_ENV: ${{ env.TALEND_CLOUD_ENV }}"
          Write-Host "TALEND_CLOUD_WORKSPACE: ${{ env.TALEND_CLOUD_WORKSPACE }}"

          Write-Host ""
          Write-Host "MAVEN"

          Write-Host "BUILDER_MAVEN_PLUGIN_VERSION: ${{ vars.BUILDER_MAVEN_PLUGIN_VERSION }}"
          Write-Host "P2_UPDATE_URL: ${{ vars.P2_UPDATE_URL }}"

          Write-Host ""
          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          Write-Host "MAVEN_HOME: $env:MAVEN_HOME"

          Write-Host ""
          Write-Host "Maven version:"
          mvn -version

          Write-Host ""
          Write-Host "======================================================"


      # ======================================================
      # 6. VERIFY TALEND PROJECT STRUCTURE
      # ======================================================

      - name: Verify Talend project structure
        shell: powershell

        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}

        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Checking Talend project"
          Write-Host "=============================================="

          # The Git checkout is:
          #
          #   main\
          #       talend_cicd\
          #
          # The physical directory remains talend_cicd.
          # Talend project logical name is TALEND_CICD.

          $projectPath = ".\talend_cicd"

          Write-Host ""
          Write-Host "Current working directory:"
          Get-Location

          Write-Host ""
          Write-Host "Talend project path:"
          Write-Host $projectPath

          if (!(Test-Path $projectPath)) {
            Write-Error "Talend project directory not found: $projectPath"
            exit 1
          }

          if (!(Test-Path "$projectPath\talend.project")) {
            Write-Error "talend.project not found: $projectPath"
            exit 1
          }

          if (!(Test-Path "$projectPath\process")) {
            Write-Error "process directory not found: $projectPath\process"
            exit 1
          }

          if (!(Test-Path ".\${{ env.CI_REPO_NAME }}\sample_pom.xml")) {
            Write-Error "sample_pom.xml not found."
            exit 1
          }

          if (!(Test-Path ".\${{ env.CI_REPO_NAME }}\license.gpg")) {
            Write-Error "license.gpg not found."
            exit 1
          }

          if (!(Test-Path ".\${{ env.CI_REPO_NAME }}\maven_settings.xml.gpg")) {
            Write-Error "maven_settings.xml.gpg not found."
            exit 1
          }

          Write-Host ""
          Write-Host "Talend project structure verified successfully."


      # ======================================================
      # 7. DECRYPT LICENSE AND MAVEN SETTINGS
      # ======================================================

      - name: Decrypt license and Maven settings
        shell: powershell

        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}

        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Decrypting Talend CI files"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "Decrypting license.gpg..."

          gpg `
            --quiet `
            --batch `
            --yes `
            --pinentry-mode loopback `
            --decrypt `
            --passphrase="${{ secrets.LARGE_SECRET_PASSPHRASE }}" `
            --output "${{ env.CI_REPO_NAME }}\license" `
            "${{ env.CI_REPO_NAME }}\license.gpg"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to decrypt license.gpg"
            exit 1
          }

          Write-Host "License decrypted successfully."

          Write-Host ""
          Write-Host "Decrypting maven_settings.xml.gpg..."

          gpg `
            --quiet `
            --batch `
            --yes `
            --pinentry-mode loopback `
            --decrypt `
            --passphrase="${{ secrets.LARGE_SECRET_PASSPHRASE }}" `
            --output "${{ env.CI_REPO_NAME }}\${{ env.MAVEN_SETTINGS }}" `
            "${{ env.CI_REPO_NAME }}\${{ env.MAVEN_SETTINGS }}.gpg"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to decrypt maven_settings.xml.gpg"
            exit 1
          }

          Write-Host "Maven settings decrypted successfully."


      # ======================================================
      # 8. INSTALL P2 AND GENERATE POMS
      # ======================================================

      - name: Install P2 and generate POMs
        shell: powershell

        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}

        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Installing P2 and generating POMs"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "P2 Update URL:"
          Write-Host "${{ vars.P2_UPDATE_URL }}"

          Write-Host ""
          Write-Host "Project expected by CI:"
          Write-Host "${{ env.PROJECT_NAME }}"

          Write-Host ""
          Write-Host "Physical project path:"
          Write-Host ".\talend_cicd"

          Write-Host ""
          Write-Host "START TIME:"
          $startTime = Get-Date
          Write-Host $startTime

          Write-Host ""
          Write-Host "Starting Maven generateAllPoms..."
          Write-Host ""

          mvn `
            -s "${{ env.CI_REPO_NAME }}\${{ env.MAVEN_SETTINGS }}" `
            -f "${{ env.CI_REPO_NAME }}\sample_pom.xml" `
            "org.talend.ci:builder-maven-plugin:${{ vars.BUILDER_MAVEN_PLUGIN_VERSION }}:generateAllPoms" `
            "-Dinstall.org.eclipse.ecf.provider.filetransfer.httpclient4.retrieve.connectTimeout=120000" `
            "-Dinstall.org.eclipse.ecf.provider.filetransfer.httpclient4.retrieve.readTimeout=120000" `
            "-Dinstall.org.eclipse.ecf.provider.filetransfer.httpclient4.browse.connectTimeout=120000" `
            "-Dorg.eclipse.equinox.p2.transport.ecf.retry=5"

          $exitCode = $LASTEXITCODE

          $endTime = Get-Date
          $elapsed = $endTime - $startTime

          Write-Host ""
          Write-Host "END TIME:"
          Write-Host $endTime

          Write-Host ""
          Write-Host "generateAllPoms duration:"
          Write-Host $elapsed

          Write-Host ""
          Write-Host "generateAllPoms exit code:"
          Write-Host $exitCode

          if ($exitCode -ne 0) {
            Write-Error "P2 installation / POM generation failed."
            exit $exitCode
          }

          Write-Host ""
          Write-Host "P2 installation and POM generation completed."


      # ======================================================
      # 9. VERIFY GENERATED POM
      # ======================================================

      - name: Verify generated POM
        shell: powershell

        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}

        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Checking generated POM"
          Write-Host "=============================================="

          $pomPath = ".\talend_cicd\poms\pom.xml"

          Write-Host ""
          Write-Host "Generated POM path:"
          Write-Host $pomPath

          if (!(Test-Path $pomPath)) {
            Write-Error "Generated POM not found: $pomPath"
            exit 1
          }

          Write-Host ""
          Write-Host "Generated POM found:"
          Write-Host $pomPath

          Write-Host ""
          Write-Host "POM size:"
          $pomFile = Get-Item $pomPath
          Write-Host "$($pomFile.Length) bytes"


      # ======================================================
      # 10. BUILD AND DEPLOY TO TALEND CLOUD
      # ======================================================

      - name: Build and deploy to Talend Cloud
        shell: powershell

        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}

        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Building and deploying Talend artifact"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "Project: ${{ env.PROJECT_NAME }}"
          Write-Host "Physical project path: .\talend_cicd"
          Write-Host "Artifact: ${{ env.JOB_LIST }}"
          Write-Host "Environment: ${{ env.TALEND_CLOUD_ENV }}"
          Write-Host "Workspace: ${{ env.TALEND_CLOUD_WORKSPACE }}"
          Write-Host "Talend Cloud URL: ${{ vars.TALEND_CLOUD_URL }}"

          $pomPath = ".\talend_cicd\poms\pom.xml"

          if (!(Test-Path $pomPath)) {
            Write-Error "POM not found: $pomPath"
            exit 1
          }

          # --------------------------------------------------
          # Cloud Publisher configuration
          # --------------------------------------------------

          $serviceUrl = "${{ vars.TALEND_CLOUD_URL }}"
          $cloudEnvironment = "${{ env.TALEND_CLOUD_ENV }}"
          $cloudWorkspace = "${{ env.TALEND_CLOUD_WORKSPACE }}"

          if ([string]::IsNullOrWhiteSpace($serviceUrl)) {
            Write-Error "TALEND_CLOUD_URL is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($cloudEnvironment)) {
            Write-Error "TALEND_CLOUD_ENV is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($cloudWorkspace)) {
            Write-Error "TALEND_CLOUD_WORKSPACE is empty."
            exit 1
          }

          Write-Host ""
          Write-Host "Cloud Publisher configuration:"
          Write-Host "service.url = $serviceUrl"
          Write-Host "cloud.publisher.environment = $cloudEnvironment"
          Write-Host "cloud.publisher.workspace = $cloudWorkspace"
          Write-Host "cloud.token = ********"

          Write-Host ""
          Write-Host "START TIME:"
          $startTime = Get-Date
          Write-Host $startTime

          Write-Host ""
          Write-Host "Starting Maven build/deploy..."
          Write-Host ""

          # --------------------------------------------------
          # IMPORTANT:
          #
          # These Cloud Publisher values are deliberately
          # passed directly to Maven.
          #
          # This follows Talend's documented CI Maven pattern:
          #
          # -Pcloud-publisher
          # -Dservice.url
          # -Dcloud.token
          # -Dcloud.publisher.screenshot
          # -Dcloud.publisher.environment
          # -Dcloud.publisher.workspace
          # --------------------------------------------------

          mvn `
            -s "${{ env.CI_REPO_NAME }}\${{ env.MAVEN_SETTINGS }}" `
            -f ".\talend_cicd\poms\pom.xml" `
            "${{ env.MAVEN_PLUGIN }}" `
            "-Dservice.url=$serviceUrl" `
            "-Dcloud.token=${{ secrets.TALEND_CLOUD_TOKEN }}" `
            "-Dcloud.publisher.screenshot=true" `
            "-Dcloud.publisher.updateFlow=true" `
            "-Dcloud.publisher.environment=$cloudEnvironment" `
            "-Dcloud.publisher.workspace=$cloudWorkspace" `
            clean `
            deploy `
            -e `
            -pl "${{ env.JOB_LIST }}" `
            -am `
            -ff `
            "-DaltReleaseDeploymentRepository=releases::default::${{ vars.ARTIFACT_URL }}/repository/releases/" `
            "-DaltSnapshotDeploymentRepository=snapshots::default::${{ vars.ARTIFACT_URL }}/repository/snapshots/"

          $exitCode = $LASTEXITCODE

          $endTime = Get-Date
          $elapsed = $endTime - $startTime

          Write-Host ""
          Write-Host "END TIME:"
          Write-Host $endTime

          Write-Host ""
          Write-Host "Build/deploy duration:"
          Write-Host $elapsed

          Write-Host ""
          Write-Host "Build/deploy exit code:"
          Write-Host $exitCode

          if ($exitCode -ne 0) {
            Write-Error "Talend build/deployment failed."
            exit $exitCode
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Talend build and deployment completed."
          Write-Host "=============================================="
