# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GITHUB_RUNNER: "self-hosted"

  # ============================================================
  # TALEND PROJECT
  # ============================================================

  # Logical Talend project name
  PROJECT_NAME: "TALEND_CICD"

  # Physical directory name in the Git repository
  #
  # The repository currently contains:
  #
  # talend_cicd
  #   ├── talend.project
  #   ├── jobs
  #   ├── sample_pom.xml
  #   ├── maven_settings.xml.gpg
  #   └── license.gpg

  CI_REPO_NAME: "talend_cicd"

  # Runtime directory name used on the Windows runner.
  #
  # This is changed from talend_cicd to TALEND_CICD
  # after checkout to avoid the Talend/Windows case conflict.
  PROJECT_PATH: "TALEND_CICD"

  GIT_MAIN_PROJECT_BRANCH: "main"
  GIT_MAIN_PROJECT_PATH: "main"

  ### TO DECOMMENT IF USING A REFERENCE PROJECT
  # GIT_MAIN_REF_PROJECT_BRANCH: "main"
  # GIT_MAIN_REF_PROJECT_PATH: "referenceproject"

  ############ JOB FILTER ####################
  JOB_LIST: "jobs/process/mydemo_0.1"

  ############# MAVEN OPTIONS ################
  MAVEN_SETTINGS: "maven_settings.xml"

  ### TO DECOMMENT WHEN USING TALEND ON-PREM
  ############# PUBLISH TO NEXUS ################
  # MAVEN_PLUGIN: "-Pnexus"

  ### TALEND CLOUD #############################
  TALEND_CLOUD_URL: "https://tmc.us.cloud.talend.com/inventory/"
  TALEND_CLOUD_ENV: "Dev"
  TALEND_CLOUD_WORKSPACE: "Cloud_Run"

  ############# PUBLISH TO CLOUD ################
  MAVEN_PLUGIN: "-Pcloud-publisher"

  ### TO DECOMMENT WHEN USING DOCKER
  ############# PUBLISH TO DOCKER ################
  # MAVEN_PLUGIN: "-Pdocker"
  # DOCKER_IMG: "xxxxx"


# ============================================================
# JOBS
# ============================================================

jobs:

  display-variables:
    name: launch build & deploy

    runs-on: self-hosted

    # Required because LARGE_SECRET_PASSPHRASE and
    # TALEND_CLOUD_TOKEN are stored in the Dev GitHub Environment
    environment: Dev

    steps:

      # ============================================================
      # 1. CONFIGURE MAVEN
      # ============================================================

      - name: Configure Maven
        shell: powershell
        run: |

          $MAVEN_HOME = "C:\apache-maven-3.9.16-bin\apache-maven-3.9.16"

          "MAVEN_HOME=$MAVEN_HOME" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "$MAVEN_HOME\bin" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Append


      # ============================================================
      # 2. DISPLAY VARIABLES
      # ============================================================

      - name: display variables
        working-directory: ${{ runner.temp }}
        shell: powershell
        run: |

          echo "**************************** VARIABLES ****************************"
          echo "ARTIFACT_URL: ${{ vars.ARTIFACT_URL }}"
          echo "BUILDER_MAVEN_PLUGIN_VERSION: ${{ vars.BUILDER_MAVEN_PLUGIN_VERSION }}"
          echo "P2_UPDATE_URL: ${{ vars.P2_UPDATE_URL }}"
          echo "TALEND_CLOUD_URL: ${{ env.TALEND_CLOUD_URL }}"
          echo "TALEND_CLOUD_ENV: ${{ env.TALEND_CLOUD_ENV }}"
          echo "TALEND_CLOUD_WORKSPACE: ${{ env.TALEND_CLOUD_WORKSPACE }}"
          echo "CI_SERVER_PROTOCOL: ${{ vars.CI_SERVER_PROTOCOL }}"
          echo "CI_SERVER_HOST: ${{ vars.CI_SERVER_HOST }}"
          echo "CI_REPO_NAME: ${{ env.CI_REPO_NAME }}"
          echo "PROJECT_NAME: ${{ env.PROJECT_NAME }}"
          echo "PROJECT_PATH: ${{ env.PROJECT_PATH }}"
          echo "GIT_MAIN_PROJECT_PATH: ${{ env.GIT_MAIN_PROJECT_PATH }}"
          echo "MAVEN_SETTINGS: ${{ env.MAVEN_SETTINGS }}"
          echo "**************************** VARIABLES ****************************"


      # ============================================================
      # 3. GIT CASE CONFIGURATION
      # ============================================================

      - name: Fix Git case sensitivity (Windows)
        shell: powershell
        run: |

          git config --global core.ignorecase true


      # ============================================================
      # 4. CHECKOUT TALEND PROJECT
      # ============================================================

      - name: Git Checkout
        uses: actions/checkout@v3
        with:
          path: ${{ env.GIT_MAIN_PROJECT_PATH }}
          ref: ${{ env.GIT_MAIN_PROJECT_BRANCH }}
          clean: true


      # ============================================================
      # 5. PREPARE TALEND PROJECT DIRECTORY
      # ============================================================

      - name: Prepare Talend project directory
        shell: powershell
        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}
        run: |

          Write-Host "Checking Talend project directory..."

          if (!(Test-Path "${{ env.CI_REPO_NAME }}\talend.project")) {
            Write-Error "Talend project not found at: ${{ env.CI_REPO_NAME }}\talend.project"
            exit 1
          }

          Write-Host "Found Talend project:"
          Write-Host "${{ env.CI_REPO_NAME }}\talend.project"

          # Windows is case-insensitive.
          # Force a physical rename through a temporary name.
          Rename-Item `
            "${{ env.CI_REPO_NAME }}" `
            "__TALEND_CICD_TEMP__"

          if (!(Test-Path "__TALEND_CICD_TEMP__")) {
            Write-Error "Temporary rename failed."
            exit 1
          }

          Rename-Item `
            "__TALEND_CICD_TEMP__" `
            "${{ env.PROJECT_PATH }}"

          if (!(Test-Path "${{ env.PROJECT_PATH }}\talend.project")) {
            Write-Error "talend.project was not found after rename."
            exit 1
          }

          Write-Host ""
          Write-Host "Talend project directory is now:"
          Write-Host "${{ env.PROJECT_PATH }}"

          Write-Host "Talend project directory prepared successfully."


      # ============================================================
      # 6. VERIFY TALEND PROJECT STRUCTURE
      # ============================================================

      - name: Verify Talend project structure
        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "Checking Talend project structure"
          Write-Host "=============================================="

          $projectPath = "${{ env.PROJECT_PATH }}"

          if (!(Test-Path "$projectPath")) {
            Write-Error "Talend project directory not found: $projectPath"
            exit 1
          }

          if (!(Test-Path "$projectPath\talend.project")) {
            Write-Error "talend.project not found."
            exit 1
          }

          if (!(Test-Path "$projectPath\sample_pom.xml")) {
            Write-Error "sample_pom.xml not found."
            exit 1
          }

          if (!(Test-Path "$projectPath\license.gpg")) {
            Write-Error "license.gpg not found."
            exit 1
          }

          if (!(Test-Path "$projectPath\maven_settings.xml.gpg")) {
            Write-Error "maven_settings.xml.gpg not found."
            exit 1
          }

          Write-Host ""
          Write-Host "Talend project structure verified successfully."


      # ============================================================
      # 7. DECRYPT LICENSE AND MAVEN SETTINGS
      # ============================================================

      - name: decrypt files
        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}\${{ env.PROJECT_PATH }}
        shell: powershell
        run: |

          gpg `
            --quiet `
            --batch `
            --yes `
            --decrypt `
            --passphrase="${{ secrets.LARGE_SECRET_PASSPHRASE }}" `
            --output "license" `
            "license.gpg"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to decrypt license.gpg"
            exit 1
          }

          gpg `
            --quiet `
            --batch `
            --yes `
            --decrypt `
            --passphrase="${{ secrets.LARGE_SECRET_PASSPHRASE }}" `
            --output "${{ env.MAVEN_SETTINGS }}" `
            "${{ env.MAVEN_SETTINGS }}.gpg"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to decrypt maven_settings.xml.gpg"
            exit 1
          }

          Write-Host "Talend CI files decrypted successfully."


      # ============================================================
      # 8. INSTALL P2 AND GENERATE POMS
      # ============================================================

      - name: install P2 and generate poms
        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "Installing P2 and generating POMs"
          Write-Host "=============================================="

          mvn -X `
            -s "${{ env.PROJECT_PATH }}\${{ env.MAVEN_SETTINGS }}" `
            -U `
            -f "${{ env.PROJECT_PATH }}\sample_pom.xml" `
            "org.talend.ci:builder-maven-plugin:${{ vars.BUILDER_MAVEN_PLUGIN_VERSION }}:generateAllPoms" `
            "-Dinstaller.clean=false" `
            "-Dlicense.path=${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}\${{ env.PROJECT_PATH }}\license" `
            "-Dtalend.studio.p2.update=${{ vars.P2_UPDATE_URL }}" `
            "-Dgeneration.type=local" `
            "-Dworkspace=${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}" `
            "-DprojectFilter=${{ env.PROJECT_NAME }}" `
            "-Dinstall.org.eclipse.ecf.provider.filetransfer.httpclient4.retrieve.connectTimeout=120000" `
            "-Dinstall.org.eclipse.ecf.provider.filetransfer.httpclient4.retrieve.readTimeout=120000" `
            "-Dinstall.org.eclipse.ecf.provider.filetransfer.httpclient4.browse.connectTimeout=120000" `
            "-Dinstall.org.eclipse.equinox.p2.transport.ecf.retry=5"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "P2 installation / POM generation failed."
            exit 1
          }

          Write-Host ""
          Write-Host "P2 installation and POM generation completed."


      # ============================================================
      # 9. VERIFY GENERATED POM
      # ============================================================

      - name: Verify generated POM
        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}
        shell: powershell
        run: |

          $pomPath = "${{ env.PROJECT_PATH }}\poms\pom.xml"

          if (!(Test-Path $pomPath)) {
            Write-Error "Generated POM not found: $pomPath"
            exit 1
          }

          Write-Host ""
          Write-Host "Generated POM found:"
          Write-Host $pomPath


      # ============================================================
      # 10. BUILD AND DEPLOY TO TALEND CLOUD
      # ============================================================

      - name: build and deploy to Talend Cloud
        working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}
        shell: powershell
        env:
          TALEND_CLOUD_URL: "https://api.us.cloud.talend.com/"
          TALEND_CLOUD_TOKEN: ${{ secrets.TALEND_CLOUD_TOKEN }}
        run: |

          Write-Host "=============================================="
          Write-Host "Building and deploying Talend artifact"
          Write-Host "=============================================="

          # --------------------------------------------------------
          # Build the values inside PowerShell rather than relying
          # on GitHub expression expansion inside the Maven command.
          # --------------------------------------------------------

          $serviceUrl = $env:TALEND_CLOUD_URL
          $cloudToken = $env:TALEND_CLOUD_TOKEN
          $cloudEnvironment = "${{ env.TALEND_CLOUD_ENV }}"
          $cloudWorkspace = "${{ env.TALEND_CLOUD_WORKSPACE }}"

          Write-Host ""
          Write-Host "Project: ${{ env.PROJECT_NAME }}"
          Write-Host "Artifact: ${{ env.JOB_LIST }}"
          Write-Host "Talend Cloud URL: $serviceUrl"
          Write-Host "Environment: $cloudEnvironment"
          Write-Host "Workspace: $cloudWorkspace"

          # --------------------------------------------------------
          # Validate required Cloud Publisher values before Maven.
          # --------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($serviceUrl)) {
            Write-Error "TALEND_CLOUD_URL is empty."
            exit 1
          }

          if ($serviceUrl -ne "https://tmc.us.cloud.talend.com/inventory/") {
            Write-Error "Unexpected Talend Cloud service URL: $serviceUrl"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($cloudToken)) {
            Write-Error "TALEND_CLOUD_TOKEN is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($cloudEnvironment)) {
            Write-Error "TALEND_CLOUD_ENV is empty."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($cloudWorkspace)) {
            Write-Error "TALEND_CLOUD_WORKSPACE is empty."
            exit 1
          }

          Write-Host "Talend Cloud publishing parameters validated successfully."

          # --------------------------------------------------------
          # Pass every Maven -D property as an individual argument.
          # This avoids the previous MAVEN_OPTS aggregation problem.
          # --------------------------------------------------------

          $mavenArgs = @(
            "-s"
            "${{ env.PROJECT_PATH }}\${{ env.MAVEN_SETTINGS }}"
            "-U"
            "-f"
            "${{ env.PROJECT_PATH }}\poms\pom.xml"
            "-Pcloud-publisher"
            "clean"
            "deploy"
            "-e"
            "-pl"
            "${{ env.JOB_LIST }}"
            "-am"
            "-ff"

            "-Dlicense.path=${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}\${{ env.PROJECT_PATH }}\license"
            "-Dtalend.studio.p2.update=${{ vars.P2_UPDATE_URL }}"
            "-Dgeneration.type=local"

            "-Dservice.url=$serviceUrl"
            "-Dcloud.token=$cloudToken"
            "-Dcloud.publisher.screenshot=true"
            "-Dcloud.publisher.updateFlow=true"
            "-Dcloud.publisher.environment=$cloudEnvironment"
            "-Dcloud.publisher.workspace=$cloudWorkspace"
          )

          Write-Host ""
          Write-Host "Starting Maven build and Cloud publication..."

          & mvn @mavenArgs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Talend build/deployment failed."
            exit 1
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "Talend build and deployment completed."
          Write-Host "=============================================="


      ## ============================================================
      ## DOCKER VERSION - NOT ENABLED
      ## ============================================================

      #- name: build and deploy to artifact repository
      #  working-directory: ${{ github.workspace }}\${{ env.GIT_MAIN_PROJECT_PATH }}
      #  shell: powershell
      #  run: |
      #    mvn `
      #      -s "${{ env.PROJECT_PATH }}\${{ env.MAVEN_SETTINGS }}" `
      #      -U `
